# nginxy - logging configuration; `version:` records the release marker (it is
# not what `--version` prints).
#
# A missing or malformed copy is not fatal: the defaults below apply.
version: 0.1.4
logging:
  file_name: nginxy.log
  folder: logs
  max_bytes: 10485760
  max_backup_count: 3
  # log_level: DEBUG | INFO | WARNING | ERROR | CRITICAL
  # This level applies unless --log-level is given on the command line.
  log_level: INFO

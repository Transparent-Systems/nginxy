name: Build Linux binary

on:
  workflow_dispatch:            # manual run: uploads the workflow artifact only.
                                # A GitHub Release is only touched by a v* tag push.
  push:
    tags: ['v*']                # every release tag builds and publishes the binary

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed by the release step at the bottom
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # v2 is the newest major of rust-cache; a v3 tag does not exist, and asking
      # for it fails the whole job at "Set up job" before any step runs.
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      # musl-tools provides musl-gcc; cmake is used by the aws-lc-rs backend of
      # rustls. Both are build-time only: the binary itself is static.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake
      - name: Build the binary
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          mkdir -p dist
          strip target/x86_64-unknown-linux-musl/release/nginxy
          cp target/x86_64-unknown-linux-musl/release/nginxy dist/nginxy
      # Prove the binary really starts: --version reads log.yaml, --help needs no
      # configuration, and the run below uses --config-dir, which is how an
      # administrator keeps the configuration elsewhere. Port 9 (discard)
      # refuses the connection, so the one-time sync ends immediately; the log it
      # wrote proves the folder was really read.
      - name: Smoke test the binary
        run: |
          file dist/nginxy
          ./dist/nginxy --version
          ./dist/nginxy --help > /dev/null
          mkdir -p /tmp/nginxy-conf
          printf 'source:\n  url: "http://127.0.0.1:9/api"\ntargets:\n  - name: "Smoke"\n    url: "http://127.0.0.1:9/api"\n' > /tmp/nginxy-conf/config.yaml
          cp log.yaml /tmp/nginxy-conf/
          printf 'NPM_SOURCE_IDENTITY=smoke@example.com\nNPM_SOURCE_SECRET=smoke\n' > /tmp/nginxy-conf/.env
          ./dist/nginxy --config-dir /tmp/nginxy-conf -p 0
          grep -q "Starting Sync" /tmp/nginxy-conf/logs/nginx_sync.log
      - name: Generate SHA256 checksum
        run: |
          cd dist
          sha256sum nginxy > nginxy.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nginxy-linux
          path: |
            dist/nginxy
            dist/nginxy.sha256
          # The binary is already compressed, so re-compressing only costs CPU.
          compression-level: 0
      # The release body is the matching section of RELEASE-NOTES.md. The task
      # exits non-zero when the tag and the version in log.yaml disagree, so a
      # mis-tagged build cannot publish the wrong notes.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo xtask release-notes --tag "${{ github.ref_name }}" --output dist/release_notes.md
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release_notes.md
          files: |
            dist/nginxy
            dist/nginxy.sha256

name: Build Windows binary

on:
  workflow_dispatch:            # manual run: uploads the workflow artifact only.
                                # A GitHub Release is only touched by a v* tag push.
  push:
    tags: ['v*']                # every release tag builds and publishes the binary

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write           # needed by the release step at the bottom
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # v2 is the newest major of rust-cache; a v3 tag does not exist, and asking
      # for it fails the whole job at "Set up job" before any step runs.
      - uses: Swatinem/rust-cache@v2
      - name: Build the binary
        run: |
          cargo build --release --locked
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\release\nginxy.exe dist\nginxy.exe
      # Windows ships without the Visual C++ Redistributable, so an exe that
      # imports VCRUNTIME140.dll dies in the loader on a clean machine: no
      # window, no output, nothing. That is what the 0.1.0 asset did; the
      # static CRT is configured in .cargo/config.toml.
      - name: Check the exe needs no runtime DLL
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\dist\nginxy.exe")
          $image = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($dll in 'VCRUNTIME140.dll', 'MSVCP140.dll') {
            if ($image.Contains($dll)) {
              throw "the exe imports $dll: it would not start without the VC++ Redistributable"
            }
          }
      # Prove the binary really starts. --version and --help need no
      # configuration; the run below uses --config-dir, so CI never relies on a
      # config.yaml sitting next to the exe.
      - name: Smoke test the binary
        shell: pwsh
        run: |
          $version = .\dist\nginxy.exe --version | Out-String
          if ($version.Trim() -notmatch '^nginxy \d+\.\d+') { throw "unexpected --version output: $version" }
          .\dist\nginxy.exe --help | Out-Null
          $conf = Join-Path $env:RUNNER_TEMP 'nginxy-conf'
          New-Item -ItemType Directory -Path $conf -Force | Out-Null
          Set-Content -Path (Join-Path $conf 'config.yaml') -Encoding ascii -Value @(
            'source:',
            '  url: "http://127.0.0.1:9/api"',
            'targets:',
            '  - name: "Smoke"',
            '    url: "http://127.0.0.1:9/api"'
          )
          Copy-Item log.yaml $conf
          Set-Content -Path (Join-Path $conf '.env') -Encoding ascii -Value @(
            'NPM_SOURCE_IDENTITY=smoke@example.com',
            'NPM_SOURCE_SECRET=smoke'
          )
          .\dist\nginxy.exe --config-dir $conf -p 0
          if (-not (Select-String -Path (Join-Path $conf 'logs\nginx_sync.log') -Pattern 'Starting Sync' -Quiet)) {
            throw 'the binary did not read the configuration folder'
          }
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\nginxy.exe -Algorithm SHA256).Hash.ToLower()
          # LF endings and no BOM, so the file also works with
          # "sha256sum -c nginxy.exe.sha256" on Linux/WSL.
          [System.IO.File]::WriteAllText("$PWD\dist\nginxy.exe.sha256", "$hash  nginxy.exe`n")
          Get-Content dist\nginxy.exe.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nginxy-windows
          path: |
            dist/nginxy.exe
            dist/nginxy.exe.sha256
          compression-level: 0
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo xtask release-notes --tag "${{ github.ref_name }}" --output dist/release_notes.md
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/release_notes.md
          files: |
            dist/nginxy.exe
            dist/nginxy.exe.sha256

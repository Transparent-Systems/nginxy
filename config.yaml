# nginxy — configuration.
#
# Put this file, log.yaml and .env next to the nginxy binary, or name this
# folder with --config-dir <PATH>.
#
# Values may use placeholders, expanded from the process environment and then
# from .env in this folder: ${VAR}, ${VAR:-default}, ${VAR:?message}, and $$ for
# a literal $. Placeholders are expanded in values only, so this comment block
# is never touched. See "Variables in the configuration files" in README.md.
#
# `source` takes `url:` and optionally `auth_payload:` — it has no `name:`.

source:
  url: "${NPM_SOURCE_URL}"

targets:
  - name: "NAS2-Nginx"
    url: "${NPM_TARGET_URL:-http://192.0.2.11:81/api}"
    auth_payload:
      identity: "${NPM_TARGET_IDENTITY}"
      secret: "${NPM_TARGET_SECRET:?set NPM_TARGET_SECRET in .env}"

  # More targets follow the same shape. A target may carry its own credentials
  # instead of the ones from .env:
  # - name: "NAS3-Nginx"
  #   url: "${NPM_TARGET3_URL:-http://192.0.2.13:81/api}"
  #   auth_payload:
  #     identity: "${NPM_TARGET3_IDENTITY}"
  #     secret: "${NPM_TARGET3_SECRET:?set NPM_TARGET3_SECRET in .env}"

